<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السند والأصل ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- إعدادات الصفحة --- */
        body {
            background-color: #34495e; /* لون السما الليلي الأزرق الغامق زي الصورة */
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            text-align: center;
            transition: background 2.5s ease;
        }

        /* --- الشمس (النور) --- */
        .sun {
            position: absolute;
            top: 10%;
            width: 120px;
            height: 120px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 80px #f1c40f;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 1;
        }

        /* --- السور الخرساني --- */
        .wall {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40vh; /* سور عالي شوية */
            /* لون رمادي خرساني مع ملمس بسيط */
            background: linear-gradient(to bottom, #95a5a6, #7f8c8d);
            border-top: 8px solid #607d8b; /* حرف السور */
            z-index: 5;
        }

        /* --- الأب (بالكاب) --- */
        .dad {
            position: absolute;
            bottom: -300px;
            right: 55%;
            width: 100px;
            height: 180px;
            /* لون الجاكيت الأزرق زي الصورة */
            background: #3498db; 
            border-radius: 40px 40px 0 0;
            z-index: 6;
            transition: bottom 1s ease-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        /* رسم الكاب */
        .dad::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: #2c3e50; /* لون الكاب الغامق */
            border-radius: 50px 50px 0 0;
        }
        .dad::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: 10px;
            background: #2c3e50;
            border-radius: 10px;
        }

        /* --- السلم --- */
        .ladder-container {
            position: absolute;
            bottom: -450px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 48vh;
            z-index: 6;
            transition: bottom 1s ease-out 0.5s;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .ladder-rail {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background: #8d6e63; /* بني خشبي */
        }
        .rail-left { left: 0; }
        .rail-right { right: 0; }

        .step {
            width: 100%;
            height: 10px;
            background: #a1887f;
            border-radius: 5px;
            position: relative;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .step::after {
            content: attr(data-text);
            position: absolute;
            right: -85px;
            top: -7px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: left;
            width: 80px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }

        /* --- البنت (شعر كيرلي) --- */
        .daughter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 90px;
            /* لون التيشيرت البرتقالي زي الصورة */
            background: #e67e22; 
            border-radius: 30px 30px 0 0;
            z-index: 7;
            transition: bottom 2.5s ease-in-out 1.2s;
        }

        /* رسم الشعر الكيرلي */
        .daughter::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: #795548; /* لون الشعر البني */
            border-radius: 50%;
            box-shadow: 
                15px 5px 0 #795548,
                -15px 5px 0 #795548,
                0 -10px 0 #5d4037; /* تفاصيل الكيرلي */
        }

        /* --- الزرار (الأحمر المنور) --- */
        .controls {
            position: absolute;
            top: 40%; /* مكان الزرار في الصورة */
            z-index: 20;
            width: 90%;
        }

        .btn {
            /* لون أحمر متدرج ومنور زي الصورة */
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            /* تأثير التوهج الأحمر */
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
            font-family: inherit;
            line-height: 1.5;
        }

        /* --- الرسالة النهائية --- */
        .message-card {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.98);
            color: #2c3e50;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            border-right: 4px solid #27ae60;
        }

        .god-praise {
            color: #27ae60;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
            font-weight: bold;
        }

        p {
            line-height: 1.7;
            margin: 0;
            font-size: 0.95rem;
        }

        .highlight {
            color: #27ae60;
            font-weight: bold;
        }

        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); } 50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(231, 76, 60, 0.8); } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); } }
    </style>
</head>
<body>

    <div class="sun"></div>

    <div class="wall"></div>

    <div class="dad" id="dad"></div>

    <div class="ladder-container" id="ladder">
        <div class="ladder-rail rail-left"></div>
        <div class="ladder-rail rail-right"></div>
        
        <div class="step" data-text="دعواتك"></div>
        <div class="step" data-text="قوتك"></div>
        <div class="step" data-text="سيرتك"></div>
        <div class="step" data-text="كفاحك"></div>
        <div class="step" data-text="تاريخك"></div>
    </div>

    <div class="daughter" id="daughter"></div>

    <div class="controls" id="controls">
        <button class="btn" onclick="startJourney()">المستقبل مجهول.. والطريق طويل وبيخوف 😟</button>
    </div>

    <div class="message-card" id="msg">
        <span class="god-praise">الحمد لله دايماً على نعمة وجودك ❤️</span>
        <p>
            المستقبل ساعات بيخوف عشان مجهول..
            بس إحنا بنرجع نطمن ونقوى لما بنفتكر إنك <span class="highlight">في ضهرنا</span>.
            <br><br>
            أنا بحاول وبعافر دلوقتي، عشان أكمل مسيرة نجاحك اللي بتشرفنا ورافعين راسنا بيها.
            وواثقة إن <span class="highlight">دعواتك</span> هي اللي بتحفظنا وبتنور طريقنا.
            <br>
            <small style="color:#7f8c8d; margin-top:15px; display:block; font-weight:bold;">ربنا يخليك لينا ويديمك السند والأصل</small>
        </p>
    </div>

    <script>
        function startJourney() {
            // 1. إخفاء الزر
            document.getElementById('controls').style.display = 'none';

            // 2. ظهور الأب
            document.getElementById('dad').style.bottom = '0';

            // 3. ظهور السلم
            const ladder = document.getElementById('ladder');
            ladder.style.bottom = '0';

            // 4. إظهار كلمات السلم
            setTimeout(() => {
                document.querySelectorAll('.step::after').forEach(el => el.style.opacity = '1');
            }, 1000);

            // 5. صعود البنت
            const daughter = document.getElementById('daughter');
            setTimeout(() => {
                daughter.style.bottom = '250px'; // تطلع أعلى شوية
            }, 1200);

            // 6. تغيير الجو للنهار (سماوي فاتح)
            setTimeout(() => {
                document.body.style.backgroundColor = '#81d4fa'; 
                document.querySelector('.sun').style.opacity = '1';
            }, 2000);

            // 7. ظهور الرسالة النهائية
            setTimeout(() => {
                document.getElementById('msg').style.transform = 'translate(-50%, -50%) scale(1)';
            }, 3000);
        }
    </script>

</body>
</html>
