<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماما حبيبتي ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* خلفية خضراء هادية تليق بلون عيونها */
            background: linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #444;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,128,0,0.15);
            width: 85%;
            max-width: 400px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #66bb6a;
            margin-bottom: 15px;
        }

        /* تنسيق صندوق الرسالة */
        #message-box {
            font-size: 1.1rem;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1b5e20;
            margin: 10px 0 15px;
            line-height: 1.5;
            font-weight: bold;
            padding: 10px;
            background-color: #f1f8e9;
            border-radius: 15px;
            border-right: 5px solid #2e7d32;
        }

        /* القلب الكامل (غير مقصوص) */
        .heart-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 10px auto 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .heart {
            background-color: #b71540; /* أحمر غامق (نبيتي) */
            display: inline-block;
            height: 30px;
            margin: 0 10px;
            position: relative;
            top: 0;
            transform: rotate(-45deg);
            width: 30px;
            animation: pulse 1.2s infinite;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #b71540;
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart:before {
            top: -15px;
            left: 0;
        }

        .heart:after {
            left: 15px;
            top: 0;
        }

        /* تنسيق الزرار الجديد (أخضر) */
        .btn {
            background: linear-gradient(45deg, #43a047, #2e7d32);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
            font-family: inherit;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        /* رسالة التأكيد */
        #status {
            margin-top: 15px;
            color: #2e7d32;
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s;
        }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.2); }
            100% { transform: rotate(-45deg) scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مامتي قلبي ❤️</h1>
        <div class="subtitle">اضغطي على القلب عشان يوصلني</div>
        
        <div class="heart-container" onclick="sendHug()">
            <div class="heart" id="mainHeart"></div>
        </div>

        <div id="message-box"></div>

        <button class="btn" onclick="sendHug()">وحشتيني يا سارة 🫂</button>
        
        <div id="status">وصل لسارة يا حبيبتي.. وأنا كمان ببعتلك حضن! 💖</div>
    </div>

    <script>
        // 1. قاعدة بيانات الرسائل
        const messages = [
            "عارفة إن الحمل تقيل والشغل مبيخلصش، بس ربنا معاكِ وبيعينك وبيبارك في صحتك. 🤲",
            "معلش.. عارفة إنك تعبانة، بس ربنا شايلك أجر كبير أوي على كل لحظة تعب بتتعبيها عشاننا. ✨",
            "ارمى ورا ظهرك.. مفيش حاجة في الدنيا تستاهل زعلك أو حرقة دمك. ضحكتك أهم من أي مشاكل. 😊",
            "كله هيعدي والله، زي ما عدا اللي أصعب منه.. سيبي تدبيرها للي خلقك وارتاحي شوية. 🌸",
            "ما تشيليش هم بكرة، بكرة ده بتاع ربنا.. خليكي في النهاردة وافرحي وبس. ⛅",
            "انتي الأمان في وسط الدوشة دي كلها.. ربنا ما يحرمني من حسك في الدنيا. 🏠",
            "وحشتيني.. ببعتلك الطاقة والحب كله في الرسالة دي، خدي نفس عميق وابتسمي. 💖",
            "انتي مش بس ماما، انتي الخير والبركة والرزق اللي في حياتي. 💎",
            "وقت ما تحسي إن طاقتك خلصت، افتكري إن ربنا هو قوتك وسندك، وهيعينك تقومي وتكملي أقوى من الأول. 💪"
        ];

        // اختيار رسالة عشوائية عند الفتح
        const msgBox = document.getElementById('message-box');
        function showRandomMessage() {
            msgBox.innerText = messages[Math.floor(Math.random() * messages.length)];
        }
        showRandomMessage();

        // 2. وظيفة إرسال الحضن عبر تليجرام
        function sendHug() {
            const status = document.getElementById('status');
            
            // --- بياناتك (تم دمجها بنجاح) ---
            const token = "8385520588:AAFow1uAKWVpkeQadgSXvTHZhaXhNq1mtgU"; 
            const chatId = "786558490"; 
            
            // الرسالة اللي هتجيلك
            const message = "🚨 إشعار حب خاص: ماما بعتتلك حضن دلوقتي! ❤️ اجري كلميها.";

            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(url).then(response => {
                if (response.ok) {
                    // نجاح الإرسال
                    status.style.opacity = '1';
                    setTimeout(() => {
                        status.style.opacity = '0';
                    }, 3000);
                } else {
                    console.log("Error sending message");
                    alert("تأكدي من الاتصال بالإنترنت ❤️");
                }
            }).catch(error => {
                console.error("Error:", error);
            });
        }
    </script>

</body>
</html>
