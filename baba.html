<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السند والأصل ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50; /* بداية ليلية (خوف من المجهول) */
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            text-align: center;
            transition: background 2.5s ease; /* تحول تدريجي للنهار */
        }

        /* --- السور (العقبة) --- */
        .wall {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35vh;
            background: #34495e;
            border-top: 5px solid #1a252f;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wall-text {
            color: rgba(255,255,255,0.05);
            font-size: 4rem;
            font-weight: bold;
            position: absolute;
            bottom: 20px;
        }

        /* --- الشمس (الأمل والنور) --- */
        .sun {
            position: absolute;
            top: 10%;
            width: 120px;
            height: 120px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 60px #f1c40f;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 1;
        }

        /* --- الأب (السند) --- */
        .dad {
            position: absolute;
            bottom: -300px;
            right: 55%; /* واقف يسند السلم */
            width: 110px;
            height: 190px;
            background: #27ae60; /* أخضر وقور */
            border-radius: 45px 45px 0 0;
            z-index: 6;
            transition: bottom 1s ease-out;
            box-shadow: 0 0 20px rgba(39, 174, 96, 0.4);
        }

        /* --- السلم --- */
        .ladder-container {
            position: absolute;
            bottom: -450px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 48vh;
            z-index: 6;
            transition: bottom 1s ease-out 0.5s; /* يظهر بعد الأب بشوية */
            display: flex;
            flex-direction: column; /* يرتب الدرجات فوق بعض */
            justify-content: space-evenly;
            align-items: center;
        }

        .ladder-rail {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #d35400;
        }
        .rail-left { left: 0; }
        .rail-right { right: 0; }

        .step {
            width: 100%;
            height: 8px;
            background: #e67e22;
            border-radius: 5px;
            position: relative;
            z-index: 2;
        }
        
        /* تنسيق كلمات السلم */
        .step::after {
            content: attr(data-text);
            position: absolute;
            right: -85px; /* الكلام على اليمين */
            top: -7px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: left;
            width: 80px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* --- البنت --- */
        .daughter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 100px;
            background: #e17055;
            border-radius: 30px 30px 0 0;
            z-index: 7;
            transition: bottom 2.5s ease-in-out 1.2s;
        }

        /* --- التحكم (الزرار) --- */
        .controls {
            position: absolute;
            top: 45%;
            z-index: 20;
            width: 90%;
        }

        .btn {
            background: #c0392b; /* لون يعبر عن القلق/الخطر */
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(192, 57, 43, 0.4);
            animation: pulse 2s infinite;
            font-family: inherit;
            line-height: 1.5;
        }

        /* --- الرسالة النهائية --- */
        .message-card {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
            border: 2px solid #27ae60;
        }

        .god-praise {
            color: #27ae60;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
            font-weight: bold;
        }

        p {
            line-height: 1.7;
            margin: 0;
            font-size: 0.95rem;
        }

        .highlight {
            color: #27ae60;
            font-weight: bold;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="sun"></div>

    <div class="wall">
        <div class="wall-text">🚧</div>
    </div>

    <div class="dad" id="dad"></div>

    <div class="ladder-container" id="ladder">
        <div class="ladder-rail rail-left"></div>
        <div class="ladder-rail rail-right"></div>
        
        <div class="step" data-text="دعواتك"></div>
        <div class="step" data-text="قوتك"></div>
        <div class="step" data-text="سيرتك"></div>
        <div class="step" data-text="كفاحك"></div>
        <div class="step" data-text="تاريخك"></div>
    </div>

    <div class="daughter" id="daughter"></div>

    <div class="controls" id="controls">
        <button class="btn" onclick="startJourney()">المستقبل مجهول.. والطريق طويل وبيخوف 😟</button>
    </div>

    <div class="message-card" id="msg">
        <span class="god-praise">الحمد لله دايماً على نعمة وجودك ❤️</span>
        <p>
            المستقبل ساعات بيخوف عشان مجهول..
            بس إحنا بنرجع نطمن ونقوى لما بنفتكر إنك <span class="highlight">في ضهرنا</span>.
            <br><br>
            أنا بحاول وبعافر دلوقتي، عشان أكمل مسيرة نجاحك اللي بتشرفنا ورافعين راسنا بيها.
            وواثقة إن <span class="highlight">دعواتك</span> هي اللي بتحفظنا وبتنور طريقنا.
            <br>
            <small style="color:#7f8c8d; margin-top:15px; display:block; font-weight:bold;">ربنا يخليك لينا ويديمك السند والأصل</small>
        </p>
    </div>

    <script>
        function startJourney() {
            // 1. إخفاء الزر
            document.getElementById('controls').style.display = 'none';

            // 2. ظهور الأب (السند)
            document.getElementById('dad').style.bottom = '0';

            // 3. ظهور السلم
            const ladder = document.getElementById('ladder');
            ladder.style.bottom = '0';

            // 4. إظهار كلمات السلم
            setTimeout(() => {
                document.querySelectorAll('.step::after').forEach(el => el.style.opacity = '1');
            }, 1000);

            // 5. صعود البنت (فوق السور)
            const daughter = document.getElementById('daughter');
            setTimeout(() => {
                daughter.style.bottom = '230px'; 
            }, 1200);

            // 6. تغيير الجو للنهار وظهور الشمس
            setTimeout(() => {
                document.body.style.backgroundColor = '#3498db'; // نهار أزرق جميل
                document.querySelector('.sun').style.opacity = '1';
            }, 2000);

            // 7. ظهور الرسالة النهائية
            setTimeout(() => {
                document.getElementById('msg').style.transform = 'translate(-50%, -50%) scale(1)';
            }, 3000);
        }
    </script>

</body>
</html>
