<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيت العز ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- إعدادات الصفحة --- */
        body {
            background-color: #2c3e50;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            text-align: center;
            transition: background 2.5s ease;
        }

        /* --- الشمس --- */
        .sun {
            position: absolute;
            top: 10%;
            width: 100px;
            height: 100px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 60px #f1c40f;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 1;
        }

        /* --- السور الخرساني --- */
        .wall {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35vh;
            background: linear-gradient(to bottom, #95a5a6, #7f8c8d);
            border-top: 6px solid #546e7a;
            z-index: 4;
        }

        /* --- حاوية العائلة --- */
        .family-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 15px; /* مسافة متساوية بينكم */
            z-index: 10;
        }

        /* --- المجموعات --- */
        .char-group {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
        }

        /* السلم */
        .ladder {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 0; 
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 15px,
                #8d6e63 15px,
                #8d6e63 20px
            );
            border-left: 4px solid #5d4037;
            border-right: 4px solid #5d4037;
            transition: height 1s ease;
            z-index: 5;
        }

        /* الشخصية */
        .person {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 2s ease-in-out 1s;
        }

        /* --- رسم الشخصيات --- */
        .body-shape { width: 45px; height: 70px; border-radius: 15px 15px 0 0; }
        .head-shape { width: 32px; height: 32px; background: #ffccbc; border-radius: 50%; margin-bottom: -5px; position: relative; z-index: 2; }
        
        .name-tag {
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.65rem;
            margin-top: 5px;
            position: absolute;
            bottom: 5px;
            color: #fff;
        }

        /* تخصيص ماما */
        .mama .body-shape { background: #8e44ad; height: 75px; }
        .mama .head-shape { background: #ecf0f1; } 
        .mama .head-shape::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; background: #ffccbc; border-radius: 50%; }

        /* تخصيص بسام */
        .bassam .body-shape { background: #16a085; }
        .bassam .head-shape::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #2c3e50; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }

        /* تخصيص سارة */
        .sara .body-shape { background: #e67e22; }
        .sara .head-shape::before { content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: 0; border-radius: 50%; border: 4px solid #5d4037; border-bottom: none; z-index: -1; }

        /* تخصيص بابا */
        .dad-group { width: 90px; z-index: 20; }
        .dad .body-shape { width: 65px; height: 100px; background: #2980b9; }
        .dad .head-shape { width: 40px; height: 40px; }
        .dad .head-shape::after { content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 45px; height: 15px; background: #34495e; border-radius: 10px 10px 0 0; }
        .dad .head-shape::before { content: ''; position: absolute; top: 8px; left: -5px; width: 50px; height: 8px; background: #34495e; border-radius: 5px; }

        /* --- الزرار --- */
        .controls {
            position: absolute;
            top: 40%;
            z-index: 30;
            width: 100%;
        }

        .btn {
            background: linear-gradient(to bottom, #c0392b, #a93226);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(192, 57, 43, 0.5);
            animation: pulse 2s infinite;
            font-family: inherit;
        }

        /* --- الرسالة --- */
        .message-card {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.98);
            color: #2c3e50;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            border: 2px solid #27ae60;
        }

        .god-praise { color: #27ae60; font-weight: bold; display: block; margin-bottom: 15px; font-size: 1.1rem; }
        .highlight { color: #27ae60; font-weight: bold; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="voice-message" src="baba.mp3" preload="auto"></audio>

    <div class="sun"></div>
    <div class="wall"></div>

    <div class="family-container">
        <div class="char-group">
            <div class="ladder" id="ladder-mama"></div>
            <div class="person mama" id="mama">
                <div class="head-shape"></div>
                <div class="body-shape"></div>
                <div class="name-tag">ماما</div>
            </div>
        </div>

        <div class="char-group">
            <div class="ladder" id="ladder-bassam"></div>
            <div class="person bassam" id="bassam">
                <div class="head-shape"></div>
                <div class="body-shape"></div>
                <div class="name-tag">بسام</div>
            </div>
        </div>

        <div class="char-group dad-group">
            <div class="person dad">
                <div class="head-shape"></div>
                <div class="body-shape"></div>
                <div class="name-tag">بابا</div>
            </div>
        </div>

        <div class="char-group">
            <div class="ladder" id="ladder-sara"></div>
            <div class="person sara" id="sara">
                <div class="head-shape"></div>
                <div class="body-shape"></div>
                <div class="name-tag">سارة</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="btn" onclick="startJourney()">المستقبل مجهول.. والطريق طويل وبيخوف 😟</button>
    </div>

    <div class="message-card" id="msg">
        <span class="god-praise">الحمد لله دايماً على نعمة وجودك ❤️</span>
        <p>
            المستقبل ساعات بيخوف عشان مجهول.. بس إحنا بنرجع نطمن ونقوى لما بنفتكر إنك <span class="highlight">في ضهرنا</span>.
            <br><br>
            كل واحد فينا بيطلع وبينجح على السلم اللي أنت باني درجاته بـ <span class="highlight">تاريخك، كفاحك، سيرتك، قوتك، ودعواتك</span>.
            <br>
            <small style="color:#7f8c8d; margin-top:15px; display:block;">ربنا يخليك لينا ويديمك السند والأصل</small>
        </p>
    </div>

    <script>
        function startJourney() {
            // 0. تشغيل الصوت
            var audio = document.getElementById("voice-message");
            if (audio) {
                audio.play().catch(function(error) {
                    console.log("Audio play failed: ", error);
                });
            }

            // 1. إخفاء الزر
            document.getElementById('controls').style.display = 'none';

            // 2. ظهور السلالم (كلهم نفس الطول بالظبط)
            const ladderHeight = '220px'; // رقم ثابت للكل
            document.getElementById('ladder-mama').style.height = ladderHeight;
            document.getElementById('ladder-bassam').style.height = ladderHeight;
            document.getElementById('ladder-sara').style.height = ladderHeight;

            // 3. صعود الشخصيات (كلهم نفس المسافة بالظبط)
            const climbHeight = 'translateY(-170px)'; // رقم ثابت للكل
            setTimeout(() => {
                document.getElementById('mama').style.transform = climbHeight;
                document.getElementById('bassam').style.transform = climbHeight;
                document.getElementById('sara').style.transform = climbHeight;
            }, 1000);

            // 4. النور والشمس
            setTimeout(() => {
                document.body.style.backgroundColor = '#81d4fa'; 
                document.querySelector('.sun').style.opacity = '1';
            }, 2000);

            // 5. الرسالة النهائية
            setTimeout(() => {
                document.getElementById('msg').style.transform = 'translate(-50%, -50%) scale(1)';
            }, 2800);
        }
    </script>

</body>
</html>
